<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Administration | Matoranhembe</title><link rel="stylesheet" href="style.css"><style>body{background:#faf6f4}.shell{max-width:1120px;margin:35px auto;padding:20px}.panel{background:white;border:1px solid #eee;border-radius:12px;padding:24px;margin:20px 0}.panel h2{color:#780f26;font-family:Georgia,serif}.hidden{display:none!important}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{border:1px solid #780f26;border-radius:6px;background:white;color:#780f26;padding:10px 14px}.tabs button.active{background:#780f26;color:white}.rowform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rowform label{font-size:13px}.rowform input,.rowform select,.rowform textarea{width:100%;display:block;margin-top:6px;padding:12px;border:1px solid #ddd;border-radius:5px}.rowform button{grid-column:1/-1}.record{padding:12px;border-bottom:1px solid #eee;font-size:14px}.record strong{color:#780f26}.record small{display:block;color:#777;margin-top:5px}.record select{margin-left:10px}.alert{color:#780f26}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}@media(max-width:650px){.rowform{grid-template-columns:1}}</style></head><body><header><nav><a class="brand" href="/"><span class="crest">M</span><span>MATORANHEMBE<small>SCHOOL ADMINISTRATION</small></span></a><a href="/">← School website</a></nav></header><div class="shell"><section class="panel" id="login"><h2>Staff sign in</h2><p>Only authorised school accounts may access student and enrollment records.</p><form id="loginForm" class="rowform"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="head"><h1>Administration dashboard</h1><button id="logout" class="outline">Sign out</button></div><p id="identity"></p><div class="tabs"><button data-tab="enrollments" class="active">Applications</button><button data-tab="students">Students</button><button data-tab="staff">Staff</button><button data-tab="milestones">Milestones</button><button data-tab="messages">Messages</button></div><section class="panel" id="content"></section></section><p id="notice" role="status" class="alert"></p></div><script src="admin.js"></script></body></html>
